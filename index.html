    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weiterleitung zu AuraPaws</title>
    <style>
        /* Basis-Styling, inspiriert durch moderne, tierfreundliche Brandings (hell, clean, einladend) */
        :root {
            --primary: #8b5cf6; /* Ein warmes, sanftes Lila, oft für moderne Tier-Shops genutzt */
            --bg: #fdfcf8;      /* Ein sehr sanftes Off-White/Creme */
            --text: #1f2937;    /* Dunkles Grau statt hartem Schwarz */
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            text-align: center;
        }

        .container {
            padding: 2rem;
            max-width: 400px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px; /* Abgerundete Buttons sind modern */
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Willkommen bei AuraPaws</h1>
        <p>Wir leiten dich direkt zum Shop weiter.</p>
        <br>
        <a href="https://aurapaws.lovable.app" class="btn">Klicke hier, um zum Shop zu gelangen</a>
    </div>
</body>
</html>
