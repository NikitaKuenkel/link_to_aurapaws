    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sichere Weiterleitung | AuraPaws</title>
    <style>
        :root {
            --primary: #00a8ac; 
            /* Sanfter Verlaufshintergrund */
            --bg-gradient: linear-gradient(135deg, #fdfcf8 0%, #eefbfb 100%);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Segoe UI', -apple-system, sans-serif;
            color: #374151;
        }

        .card {
            background: white;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 168, 172, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(0, 168, 172, 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #1f2937;
        }

        p {
            margin-bottom: 2rem;
            line-height: 1.6;
            color: #6b7280;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 1.2rem 2.5rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 168, 172, 0.3);
        }

        /* Kleiner Hinweis für das Sicherheitsgefühl */
        .secure-note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Fast geschafft!</h1>
        <p>Wir leiten dich sicher weiter in unseren Shop, damit du das Beste für deinen Liebling findest.</p>
        
        <button class="btn" onclick="window.location.href='https://aurapaws.lovable.app'">
            Zum Shop weitergehen
        </button>

        <div class="secure-note">
            <span>🔒 Sichere Verbindung</span>
        </div>
    </div>

</body>
</html>
